name: Generate Contribution Snake

on:
  schedule:
    - cron: "0 0 * * *"   # setiap hari jam 00:00 UTC
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate snake
        uses: Platane/snk@v3
        with:
          github_user_name: ivanwilliaml
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark&color_snake=%23FACC15&color_dots=%231E293B,%231E3A8A,%233B5BDB,%236D28D9,%23A78BFA
            dist/github-contribution-grid-snake.gif?color_snake=%23FACC15&color_dots=%231E293B,%231E3A8A,%233B5BDB,%236D28D9,%23A78BFA

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
