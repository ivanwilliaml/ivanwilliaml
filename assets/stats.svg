<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="130" viewBox="0 0 1200 130" role="img">
  
  <defs>
    <linearGradient id="bg-st" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070B14"/><stop offset="1" stop-color="#0B1226"/>
    </linearGradient>
    <linearGradient id="glass-st" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.03"/>
    </linearGradient>
    <linearGradient id="stroke-st" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.08"/>
    </linearGradient>
    <linearGradient id="accent-st" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#60A5FA"/><stop offset="1" stop-color="#7C3AED"/>
    </linearGradient>
    <filter id="blur-st" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="70"/>
    </filter>
  </defs>
  <clipPath id="clip-st"><rect width="1200" height="130" rx="24"/></clipPath>
  <g clip-path="url(#clip-st)">
    <rect width="1200" height="130" fill="url(#bg-st)"/>
  <circle cx="150" cy="130" r="200" fill="#2563EB" opacity="0.35" filter="url(#blur-st)">
    <animateTransform attributeName="transform" type="translate" values="0 0; 40 0; 0 0"
      dur="15s" repeatCount="indefinite" calcMode="spline" keySplines="0.45 0 0.55 1; 0.45 0 0.55 1"/>
  </circle>
  <circle cx="1050" cy="0" r="200" fill="#7C3AED" opacity="0.3" filter="url(#blur-st)">
    <animateTransform attributeName="transform" type="translate" values="0 0; -40 0; 0 0"
      dur="18s" repeatCount="indefinite" calcMode="spline" keySplines="0.45 0 0.55 1; 0.45 0 0.55 1"/>
  </circle>
  </g>
  <rect x="0.5" y="0.5" width="1199" height="129" rx="24" fill="none" stroke="#FFFFFF" stroke-opacity="0.06"/>
  
  <rect x="30.0" y="20" width="273.0" height="90" rx="18" fill="url(#glass-st)"
    stroke="url(#stroke-st)" stroke-width="1"/><text x="166.5" y="62" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="28" font-weight="700" fill="#F1F5F9" text-anchor="middle" letter-spacing="0">2×</text><text x="166.5" y="88" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="500" fill="#94A3B8" text-anchor="middle" letter-spacing="0">National Champion</text>
  <rect x="319.0" y="20" width="273.0" height="90" rx="18" fill="url(#glass-st)"
    stroke="url(#stroke-st)" stroke-width="1"/><text x="455.5" y="62" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="28" font-weight="700" fill="#F1F5F9" text-anchor="middle" letter-spacing="0">3.94</text><text x="455.5" y="88" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="500" fill="#94A3B8" text-anchor="middle" letter-spacing="0">GPA / 4.00</text>
  <rect x="608.0" y="20" width="273.0" height="90" rx="18" fill="url(#glass-st)"
    stroke="url(#stroke-st)" stroke-width="1"/><text x="744.5" y="62" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="28" font-weight="700" fill="#F1F5F9" text-anchor="middle" letter-spacing="0">250+</text><text x="744.5" y="88" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="500" fill="#94A3B8" text-anchor="middle" letter-spacing="0">Members Led</text>
  <rect x="897.0" y="20" width="273.0" height="90" rx="18" fill="url(#glass-st)"
    stroke="url(#stroke-st)" stroke-width="1"/><text x="1033.5" y="62" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="28" font-weight="700" fill="#F1F5F9" text-anchor="middle" letter-spacing="0">16</text><text x="1033.5" y="88" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="500" fill="#94A3B8" text-anchor="middle" letter-spacing="0">Projects on GitHub</text>
</svg>
