<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="150" viewBox="0 0 1200 150" role="img">
  
  <defs>
    <linearGradient id="bg-st" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#060D1F"/><stop offset="1" stop-color="#0B1F3A"/>
    </linearGradient>
    <linearGradient id="glass-st" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.16"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.07"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.04"/>
    </linearGradient>
    <linearGradient id="stroke-st" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.45"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.30"/>
    </linearGradient>
    <linearGradient id="accent-st" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FACC15"/><stop offset="1" stop-color="#7C3AED"/>
    </linearGradient>
    <filter id="blur-st" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="55"/>
    </filter>
    <filter id="shadow-st" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="1200" height="150" rx="28" fill="url(#bg-st)"/>
  <clipPath id="clip-st"><rect width="1200" height="150" rx="28"/></clipPath>
  <g clip-path="url(#clip-st)">
  <circle cx="150" cy="75" r="160" fill="#7C3AED" opacity="0.4" filter="url(#blur-st)">
    <animateTransform attributeName="transform" type="translate"
      values="0 0; 40 0; 0 0" dur="15s" repeatCount="indefinite" calcMode="spline"
      keySplines="0.45 0 0.55 1; 0.45 0 0.55 1"/>
  </circle>
  <circle cx="1050" cy="75" r="160" fill="#2563EB" opacity="0.5" filter="url(#blur-st)">
    <animateTransform attributeName="transform" type="translate"
      values="0 0; -40 0; 0 0" dur="13s" repeatCount="indefinite" calcMode="spline"
      keySplines="0.45 0 0.55 1; 0.45 0 0.55 1"/>
  </circle>
  <circle cx="600" cy="160" r="140" fill="#FACC15" opacity="0.25" filter="url(#blur-st)">
