<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img">
  
  <defs>
    <linearGradient id="bg-hd" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070B14"/><stop offset="1" stop-color="#0B1226"/>
    </linearGradient>
    <linearGradient id="glass-hd" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.03"/>
    </linearGradient>
    <linearGradient id="stroke-hd" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.08"/>
    </linearGradient>
    <linearGradient id="accent-hd" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#60A5FA"/><stop offset="1" stop-color="#7C3AED"/>
    </linearGradient>
    <filter id="blur-hd" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="70"/>
    </filter>
  </defs>
  <clipPath id="clip-hd"><rect width="1200" height="300" rx="24"/></clipPath>
  <g clip-path="url(#clip-hd)">
    <rect width="1200" height="300" fill="url(#bg-hd)"/>
  <circle cx="220" cy="60" r="260" fill="#2563EB" opacity="0.45" filter="url(#blur-hd)">
    <animateTransform attributeName="transform" type="translate" values="0 0; 50 30; 0 0"
      dur="16s" repeatCount="indefinite" calcMode="spline" keySplines="0.45 0 0.55 1; 0.45 0 0.55 1"/>
  </circle>
  <circle cx="1060" cy="300" r="240" fill="#7C3AED" opacity="0.35" filter="url(#blur-hd)">
    <animateTransform attributeName="transform" type="translate" values="0 0; -50 -40; 0 0"
      dur="19s" repeatCount="indefinite" calcMode="spline" keySplines="0.45 0 0.55 1; 0.45 0 0.55 1"/>
  </circle>
  </g>
  <rect x="0.5" y="0.5" width="1199" height="299" rx="24" fill="none" stroke="#FFFFFF" stroke-opacity="0.06"/>
  
  <rect x="80" y="50" width="1040" height="200" rx="24" fill="url(#glass-hd)"
    stroke="url(#stroke-hd)" stroke-width="1"/>
  <rect x="120" y="90" width="44" height="4" rx="2" fill="url(#accent-hd)"/>
  <text x="120" y="140" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="42" font-weight="700" fill="#F1F5F9" text-anchor="start" letter-spacing="-0.5">Ivan William Lianata</text>
  <text x="120" y="170" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18" font-weight="500" fill="#60A5FA" text-anchor="start" letter-spacing="0">Data Science Student @ BINUS University  ·  GPA 3.94 / 4.00</text>
  
  <rect x="120" y="188" width="259" height="30" rx="15.0" fill="#FFFFFF" fill-opacity="0.06"
    stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="1"/>
  <text x="249.31" y="207.68" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="500" fill="#F1F5F9" text-anchor="middle" letter-spacing="0">2× National Data Science Champion</text>
  <rect x="388.62" y="188" width="183" height="30" rx="15.0" fill="#FFFFFF" fill-opacity="0.06"
    stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="1"/>
  <text x="479.97" y="207.68" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="500" fill="#F1F5F9" text-anchor="middle" letter-spacing="0">COO · BNCC Kemanggisan</text>
  <rect x="581.32" y="188" width="154" height="30" rx="15.0" fill="#FFFFFF" fill-opacity="0.06"
    stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="1"/>
  <text x="658.11" y="207.68" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="500" fill="#F1F5F9" text-anchor="middle" letter-spacing="0">Jakarta, Indonesia</text>

</svg>
